<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieVerse</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

header{
    background:linear-gradient(to right,#ff0000,#8b0000);
    padding:20px;
    text-align:center;
}

header h1{
    font-size:40px;
}

header p{
    margin-top:10px;
    font-size:18px;
}

.container{
    padding:30px;
}

.movies{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1c1c1c;
    border-radius:15px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card-content h2{
    margin-bottom:10px;
    color:#ff4444;
}

.card-content p{
    font-size:14px;
    line-height:1.5;
}

footer{
    text-align:center;
    padding:20px;
    background:#111;
    margin-top:30px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    background:red;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#ff4444;
}

</style>

</head>
<body>

<header>
    <h1>🎬 MovieVerse</h1>
    <p>Discover Amazing Horror Movies</p>
</header>

<div class="container">

<div class="movies">

<div class="card">
<img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=800&auto=format&fit=crop" alt="">
<div class="card-content">
<h2>The Ring</h2>
<p>A mysterious videotape brings terror to everyone who watches it.</p>
<button onclick="alert('The Ring is one of the scariest horror movies ever!')">Watch Info</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=800&auto=format&fit=crop" alt="">
<div class="card-content">
<h2>Wrong Turn</h2>
<p>Travelers get trapped in the woods with dangerous killers.</p>
<button onclick="alert('Wrong Turn was released in 2003!')">Watch Info</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=800&auto=format&fit=crop" alt="">
<div class="card-content">
<h2>Annabelle</h2>
<p>A haunted doll causes terrifying supernatural events.</p>
<button onclick="alert('Annabelle is based on a famous haunted doll story!')">Watch Info</button>
</div>
</div>

</div>

</div>

<footer>
    <p>Created by Me for #MyFirstWebsite 🚀</p>
</footer>

</body>
               </html>
